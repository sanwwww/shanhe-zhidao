# Render Blueprint：在 Render 控制台 New → Blueprint 选中本仓库即可一键创建
# 也可以手动 New Web Service，按下面的 build/start 命令照抄
services:
  - type: web
    name: shanhe-zhidao
    runtime: python
    plan: free
    # 建库步骤保留：现在只做"语料可解析、条目非空"的校验，不下载任何模型。
    # （原先这一步会下载约 79MB embedding 模型并预建向量索引；该依赖已移除，
    #   原因见 README「一次真实的生产故障」——它会在 512MB 实例上触发 OOM。）
    buildCommand: pip install -r requirements.txt && python servers/knowledge_server.py --build
    # --workers 1 是硬要求：MemorySaver 是进程内存态，多 worker 会让同一 thread_id
    # 的请求随机落到不同进程，多轮记忆直接丢失且难以排查
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT --workers 1
    # 若 Blueprint 校验不识别 healthCheckPath，删掉本行，改到控制台 Health Check 里填 /health
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false        # 在 Render 控制台手动填，绝不入库
      - key: AMAP_KEY
        sync: false        # 可选：高德 Key，不填则地图工具走优雅降级
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
